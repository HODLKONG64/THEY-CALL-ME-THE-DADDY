[project]
name = "they-call-me-the-daddy"
version = "1.0.0"
description = "Self-evolving agent system"
requires-python = ">=3.11"

dependencies = [
    "openai>=1.30.0",
    "boto3>=1.34.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.27.0",
    "rich>=13.7.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "pytest>=8.2.0"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]