name: daddy-cycle

on:
  push:
    branches:
      - main
    paths-ignore:
      - "src/the_daddy/engine.py"
      - "src/the_daddy/cli.py"
      - "src/the_daddy/agents/**"
      - "src/the_daddy/core/**"
      - ".github/workflows/daddy-cycle.yml"
      - ".github/workflows/main_with_openai_upgrade_gate.yml"
      - ".github/workflows/pre_update_guard.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: daddy-cycle
  cancel-in-progress: false

jobs:
  run-daddy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Clean workspace
        run: |
          find . -type d -name "__pycache__" -exec rm -rf {} +
          find . -type f -name "*.pyc" -delete
          rm -rf .pytest_cache build dist *.egg-info

      - name: Remove tracked junk files
        run: |
          git rm -r --cached --ignore-unmatch __pycache__ .pytest_cache build dist *.egg-info

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install . --no-cache-dir

      - name: Configure git identity
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Generate OpenAI upgrade advice
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_UPGRADE_MODEL: gpt-5.4
        run: |
          python -m src.the_daddy.core.request_upgrade_advice --repo-root . --output doctor_local/upgrade_advice.json

      - name: Validate OpenAI upgrade advice
        run: |
          python -m src.the_daddy.core.require_upgrade_advice doctor_local/upgrade_advice.json

      - name: Run tests
        run: pytest -q

      - name: Run Daddy
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: HODLKONG64/THEY-CALL-ME-THE-DADDY
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          DADDY_COMMAND: pytest -q
          DADDY_TARGET_ROOT: .
          DADDY_ENABLE_SELF_EVOLUTION: "true"
          DADDY_ENABLE_ARCHITECTURE_LANE: "true"
          DADDY_UPGRADE_ADVICE_PATH: doctor_local/upgrade_advice.json
          PYTHONUNBUFFERED: "1"
        run: |
          python -m src.the_daddy.cli run

      - name: Done
        run: echo "Daddy cycle complete"
