name: daddy-cycle

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  run-daddy:
    runs-on: ubuntu-latest

    concurrency:
      group: daddy-cycle
      cancel-in-progress: false

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 🔥 HARD CLEAN — remove ghost tests / cache contamination
      - name: Clean workspace
        run: |
          find . -type d -name "__pycache__" -exec rm -rf {} +
          find . -type f -name "*.pyc" -delete
          rm -rf .pytest_cache
          rm -rf build dist *.egg-info

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install . --no-cache-dir

      - name: Run Daddy
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: HODLKONG64/THEY-CALL-ME-THE-DADDY
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          DADDY_COMMAND: pytest -q
          DADDY_TARGET_ROOT: .
          DADDY_ENABLE_SELF_EVOLUTION: "true"
          DADDY_ENABLE_ARCHITECTURE_LANE: "true"
          PYTHONUNBUFFERED: "1"
        run: |
          python -m src.the_daddy.cli run || true

      - name: Commit safe changes only
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add src/
          git add tests/ || true
          git add README.md || true
          git add ARCHITECTURE.md || true
          git add .github/workflows/daddy-cycle.yml || true
          git add .gitignore || true

          # 🔒 prevent junk / ghost files
          git restore --staged build dist '*.egg-info' bool None str int float list dict tuple set path README_FIX.md THEY-CALL-ME-THE-DADDY 2>/dev/null || true

          git diff --cached --quiet || git commit -m "auto: daddy evolution"
          git push

      - name: Done
        run: echo "Daddy cycle complete"
